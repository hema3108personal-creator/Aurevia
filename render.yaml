services:
  - type: web
    name: aurevia-travel-platform
    env: node
    plan: free
    buildCommand: npm install && cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npx tsx production-server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
